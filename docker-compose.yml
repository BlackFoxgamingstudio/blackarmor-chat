version: "3.9"
# Sovereign BlackArmor Chat — docker-compose
# Usage: docker-compose up --build

services:
  blackarmor-chat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-blackarmor-chat:latest
    container_name: sovereign-blackarmor-chat
    restart: unless-stopped
    ports:
      - "8804:8804"
    environment:
      SBB_CHAT_SECRET_KEY: ${SBB_CHAT_SECRET_KEY}
      SBB_REDIS_URL: ${SBB_REDIS_URL}
      SBB_MAX_CONNECTIONS: ${SBB_MAX_CONNECTIONS}
      SBB_ENCRYPTION_ALGO: ${SBB_ENCRYPTION_ALGO}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8804
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8804/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
